[package]
name = "bbrain"
version = "0.1.3"
description = "Bbrain — local-first research knowledge base"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bbrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

rusqlite = { version = "0.32", features = ["bundled", "uuid", "backup"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
sha2 = "0.10"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3.32"
sqlite-vec = "0.1"
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
notify = "8"

[dev-dependencies]
tempfile = "3"

[features]
# by default Tauri runs in production mode, `tauri dev` sets this
custom-protocol = ["tauri/custom-protocol"]
